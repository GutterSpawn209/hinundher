<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hin &amp; Her — German / English drill</title>
<meta name="theme-color" content="#EDF0EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hin & Her">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF0EA; --panel:#FFFFFF; --ink:#1B1F24; --muted:#6C7480; --line:#D3D9CE;
    --der:#2F62C8; --die:#C43F7C; --das:#2E8A5B;
    --ok:#2F7A4D; --okbg:#E1F1E6;
    --minor:#9A5B00; --minorbg:#FBEFD6;
    --bad:#B3261E; --badbg:#F9E3E1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;display:flex;justify-content:center}
  main{width:100%;max-width:480px;padding:16px 18px 96px;display:flex;flex-direction:column;gap:18px}

  .strip{display:flex;align-items:baseline;gap:14px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
  .strip b{color:var(--ink);font-weight:800}
  .strip button{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .strip button[aria-expanded="true"]{color:var(--ink)}
  .strip .help-btn{margin-left:auto;flex:none;width:24px;height:24px;border:1.5px solid var(--muted);border-radius:50%;text-decoration:none;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;align-self:center}
  .strip #keyBtn[hidden]{display:none}

  /* Help */
  .help{position:fixed;inset:0;z-index:20;background:rgba(27,31,36,.45);display:flex;align-items:flex-end;justify-content:center}
  .help[hidden]{display:none}
  .help-box{width:100%;max-width:480px;height:min(82dvh,640px);background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
  @media (min-width:520px){.help{align-items:center}.help-box{border-radius:18px}}
  .help-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;font-weight:800;font-size:16px;border-bottom:1px solid var(--line)}
  .help-head button{background:none;border:0;font:inherit;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:0 2px}
  .help-body{display:flex;flex:1;min-height:0}
  .help-nav{flex:0 0 100px;border-right:1px solid var(--line);overflow-y:auto;padding:6px 0}
  .help-nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 8px 9px 11px;font:inherit;font-size:12.5px;font-weight:700;line-height:1.25;color:var(--muted);cursor:pointer}
  .help-nav button[aria-current="true"]{color:var(--ink);border-left-color:var(--ink);background:var(--panel)}
  .help-pane{flex:1;min-width:0;display:flex;flex-direction:column}
  .help-page{flex:1;overflow-y:auto;padding:14px 16px;font-size:15px;line-height:1.5}
  .help-page h3{margin:0 0 8px;font-size:17px;font-weight:800}
  .help-page p{margin:0 0 10px}
  .help-page .ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0 12px;font-size:14px}
  .help-page .ex div{padding:2px 0}
  .help-page .ok{color:var(--ok);font-weight:700}.help-page .no{color:var(--bad);font-weight:700}
  .help-page kbd{font:inherit;font-weight:800;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 6px}
  .help-pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .help-pager button{background:none;border:1px solid var(--line);border-radius:999px;width:34px;height:30px;font:inherit;font-size:18px;color:var(--ink);cursor:pointer}
  .help-pager button:disabled{opacity:.3;cursor:default}
  .help-pager span{display:flex;gap:6px}
  .help-pager i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
  .help-pager i.on{background:var(--ink)}

  /* Word bank */
  .bank-filters{padding:10px 14px 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .bank-filters .frow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .bank-filters .frow::-webkit-scrollbar{display:none}
  .bank-filters button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
  .bank-filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .bank-list{flex:1;overflow-y:auto;padding:4px 16px calc(12px + env(safe-area-inset-bottom))}
  .bank-list h4{margin:12px 0 4px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .bank-list .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .bank-list h4+.row{border-top:0}
  .bank-list .w{flex:1;min-width:0}
  .bank-list .tgt{display:block;font-weight:800;font-size:16px;overflow-wrap:anywhere}
  .bank-list .nat{display:block;font-size:13px;color:var(--muted);font-weight:600}
  .bank-list .meta{flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--muted);line-height:1.3}
  .bank-list .meta b{color:var(--bad)}
  .bank-list .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--okbg);color:var(--ok);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
  .bank-foot{display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .bank-foot button{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer}
  .bank-foot span{font-size:12px;color:var(--muted);font-weight:600;margin-left:auto;text-align:right}
  .bank-list .empty{padding:24px 0;color:var(--muted);font-size:15px;text-align:center}

  .scope{display:flex;gap:6px;margin-bottom:-6px}
  .scope[hidden]{display:none}
  .scope button,#sub .tab{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .scope button[aria-pressed="true"],#sub .tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  #sub .tab{margin:0 6px 0 0}
  .say{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;vertical-align:middle;margin-left:8px}
  .say:active{background:var(--bg)}
  .say.speaking{border-color:var(--ok);color:var(--ok)}
  .bank-list .say{padding:3px 9px;font-size:12px;margin:0 0 0 6px}
  .bank-list .note{display:block;font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
  #stage{min-height:120px;padding-top:10px}
  #prompt{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
  #sub{margin:10px 0 0;font-size:16px;line-height:1.4;color:var(--muted);font-weight:500}
  #sub .chip{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:4px 6px 0 0;color:var(--ink);font-weight:600;font-size:15px}

  #form{display:flex;gap:8px}
  #go{flex:none;font:inherit;font-size:16px;font-weight:800;padding:0 18px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer}
  #go:disabled{opacity:.45;cursor:default}
  #go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #in{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:600;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);outline:none}
  #in:focus{border-color:var(--ink)}
  #in::placeholder{color:#A3AAB3;font-weight:500}
  #in:disabled{opacity:.6}

  .aids{display:flex;gap:10px;margin-top:-6px}
  .aids[hidden]{display:none}
  .aids button{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
  .aids button:disabled{opacity:.45;cursor:default}
  .aids button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #sub .hint{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;letter-spacing:.12em;color:var(--ink);font-weight:600;display:block;margin-top:8px}
  .verdict.hinted{background:var(--minorbg);color:var(--minor)}

  /* Frau Shego */
  .teacher{display:flex;gap:10px;align-items:flex-end;min-height:90px;margin-top:-4px}
  #frau{width:88px;height:88px;flex:none;overflow:visible}
  .bubble{flex:1;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin-bottom:14px;transition:opacity .2s}
  .bubble::before{content:"";position:absolute;left:-6px;bottom:16px;width:11px;height:11px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
  .bubble .de{display:block;font-weight:800;font-size:17px;line-height:1.25}
  .bubble .en{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
  .bubble .en:empty{display:none}
  .teacher.quiet .bubble{opacity:0}
  #frau .head,#frau .brow,#frau .mouth,#frau .lid,#frau .blush{transition:transform .22s ease,opacity .22s ease}
  #frau .head{transform-box:fill-box;transform-origin:50% 92%}
  #frau .brow,#frau .lid{transform-box:fill-box}
  #frau .brow{transform-origin:50% 50%}
  .teacher .lid{transform-origin:50% 0;transform:scaleY(0)}
  #frau .blinklid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
  .teacher .mouth{opacity:0}
  .teacher .blush{opacity:0}
  [data-face="idle"] .mouth-neutral{opacity:1}
  [data-face="pleased"] .mouth-smile{opacity:1}
  [data-face="pleased"] .blush{opacity:1}
  [data-face="pleased"] .brow{transform:translateY(-3px)}
  [data-face="pleased"] .lid{transform:scaleY(.38)}
  [data-face="unimpressed"] .mouth-flat{opacity:1}
  [data-face="unimpressed"] .brow-r{transform:translateY(-4.5px) rotate(-6deg)}
  [data-face="unimpressed"] .brow-l{transform:translateY(1.5px)}
  [data-face="unimpressed"] .lid{transform:scaleY(.5)}
  [data-face="resigned"] .mouth-frown{opacity:1}
  [data-face="resigned"] .brow-l{transform:translateY(-1px) rotate(-14deg)}
  [data-face="resigned"] .brow-r{transform:translateY(-1px) rotate(14deg)}
  [data-face="resigned"] .lid{transform:scaleY(1)}
  [data-face="resigned"] .head{transform:rotate(-6deg)}
  @media (prefers-reduced-motion:no-preference){
    #frau .blinklid{animation:blink 4.6s infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(0)}95%,97%{transform:scaleY(1)}}
    [data-face="pleased"] .head{animation:bounce .5s ease}
    @keyframes bounce{0%{transform:translateY(0)}35%{transform:translateY(-6px)}70%{transform:translateY(2px)}100%{transform:translateY(0)}}
    [data-face="unimpressed"] .head{animation:tut .5s ease}
    @keyframes tut{0%,100%{transform:rotate(0)}40%{transform:rotate(3deg)}}
  }

  #feedback{background:var(--panel);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
  #feedback[hidden]{display:none}
  .verdict{display:inline-flex;align-self:flex-start;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800}
  .verdict.ok{background:var(--okbg);color:var(--ok)}
  .verdict.minor{background:var(--minorbg);color:var(--minor)}
  .verdict.bad{background:var(--badbg);color:var(--bad)}
  .answer{font-size:24px;font-weight:800;line-height:1.2}
  .answer small{font-size:15px;font-weight:600;color:var(--muted);margin-left:8px}
  .reason{font-size:15px;line-height:1.45;font-weight:500}
  .example{font-size:15px;color:var(--muted);font-style:italic}
  .next{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
  .auto{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
  .auto i{display:block;height:100%;background:var(--ok);width:100%;transform-origin:left}
  @media (prefers-reduced-motion:no-preference){.auto i{animation:drain 2.5s linear forwards}@keyframes drain{to{transform:scaleX(0)}}}
  .g{font-weight:800}
  .g.der{color:var(--der)} .g.die{color:var(--die)} .g.das{color:var(--das)}


  #notice{margin:0;font-size:14px;color:var(--bad);font-weight:600;min-height:1em}
  #notice:empty{display:none}
  #notice.good{color:var(--ok)}

  nav.modes{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);padding:8px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  nav.modes div{display:flex;width:100%;max-width:444px}
  nav.modes button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 0 8px;font:inherit;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer}
  nav.modes button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  nav.modes button.dir{flex:0 0 auto;padding-left:12px;padding-right:0;font-size:13px;letter-spacing:.02em;border-bottom-color:transparent}
  nav.modes button.dir:disabled{opacity:.4}
  nav.modes button:focus-visible,#in:focus-visible,.strip button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .busy #prompt{color:var(--muted);font-weight:600;font-size:22px}
  @media (prefers-reduced-motion:no-preference){
    #feedback{animation:pop .18s ease-out}
    @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<main>
  <header class="strip">
    <span><b id="progress">0</b>/20</span>
    <span><span id="streakLbl">streak</span> <b id="streak">0</b></span>
    <span><span id="bestLbl">best</span> <b id="best">0</b></span>
    <button id="helpBtn" class="help-btn" aria-haspopup="dialog" title="Help">?</button>
    <button id="keyBtn" hidden>Key</button>
    <button id="bankBtn">Words</button>
  </header>

  <div id="scope" class="scope" hidden>
    <button type="button" data-scope="words" aria-pressed="true">Words</button>
    <button type="button" data-scope="slang" aria-pressed="false">Slang</button>
  </div>

  <section id="stage" aria-live="polite">
    <h1 id="prompt">Loading…</h1>
    <p id="sub"></p>
  </section>

  <div class="teacher" id="teacher" data-face="idle">
    <svg id="frau" viewBox="0 0 120 120" aria-hidden="true">
      <g class="body">
        <rect x="52" y="88" width="16" height="18" fill="#E6B48B"/>
        <path d="M18 122 C18 104 34 99 50 99 L60 108 L70 99 C86 99 102 104 102 122 Z" fill="#5E8A6C"/>
        <path d="M50 99 L60 108 L70 99 L66 96 L60 103 L54 96 Z" fill="#F4EFE4"/>
      </g>
      <g class="head">
        <circle cx="60" cy="19" r="13" fill="#3E2A1F"/>
        <ellipse cx="60" cy="50" rx="38" ry="31" fill="#3E2A1F"/>
        <ellipse cx="25" cy="64" rx="5" ry="7" fill="#F1C9A5"/>
        <ellipse cx="95" cy="64" rx="5" ry="7" fill="#F1C9A5"/>
        <circle cx="25" cy="71" r="1.9" fill="#C9A24A"/>
        <circle cx="95" cy="71" r="1.9" fill="#C9A24A"/>
        <ellipse cx="60" cy="62" rx="33" ry="37" fill="#F1C9A5"/>
        <path d="M27 60 C25 36 40 25 60 25 C80 25 95 36 93 60 C91 45 83 38 75 38 C67 38 60 41 51 41 C41 41 32 46 27 60 Z" fill="#3E2A1F"/>
        <path d="M27 60 C30 50 36 44 44 42" fill="none" stroke="#5A3F2E" stroke-width="1.5" stroke-linecap="round"/>
        <g class="blush">
          <ellipse cx="41" cy="75" rx="6" ry="3.5" fill="#E8927C" opacity=".5"/>
          <ellipse cx="79" cy="75" rx="6" ry="3.5" fill="#E8927C" opacity=".5"/>
        </g>
        <g class="eye">
          <ellipse cx="47" cy="63" rx="6.5" ry="5.5" fill="#fff"/>
          <circle cx="47.5" cy="63.5" r="3.5" fill="#1B1F24"/>
          <circle cx="49" cy="62" r="1.1" fill="#fff"/>
          <rect class="blinklid" x="39" y="56.5" width="16" height="13" fill="#F1C9A5"/>
          <rect class="lid lid-l" x="39" y="56.5" width="16" height="13" fill="#F1C9A5"/>
        </g>
        <g class="eye">
          <ellipse cx="73" cy="63" rx="6.5" ry="5.5" fill="#fff"/>
          <circle cx="73.5" cy="63.5" r="3.5" fill="#1B1F24"/>
          <circle cx="75" cy="62" r="1.1" fill="#fff"/>
          <rect class="blinklid" x="65" y="56.5" width="16" height="13" fill="#F1C9A5"/>
          <rect class="lid lid-r" x="65" y="56.5" width="16" height="13" fill="#F1C9A5"/>
        </g>
        <g fill="none" stroke="#1B1F24" stroke-width="2.4" stroke-linecap="round">
          <circle cx="47" cy="63" r="11.5"/><circle cx="73" cy="63" r="11.5"/>
          <path d="M58.5 62 L61.5 62"/><path d="M35.5 61 L28 58.5"/><path d="M84.5 61 L92 58.5"/>
        </g>
        <g fill="none" stroke="#3E2A1F" stroke-width="2.8" stroke-linecap="round">
          <path class="brow brow-l" d="M38 49 Q47 44.5 56 48"/>
          <path class="brow brow-r" d="M64 48 Q73 44.5 82 49"/>
        </g>
        <path d="M60 67 Q57 74 61 75.5" fill="none" stroke="#D9A07A" stroke-width="2" stroke-linecap="round"/>
        <g fill="none" stroke="#B4574E" stroke-width="2.6" stroke-linecap="round">
          <path class="mouth mouth-neutral" d="M53 86 Q60 89.5 67 86"/>
          <path class="mouth mouth-smile" d="M50 84 Q60 93 70 84"/>
          <path class="mouth mouth-flat" d="M52 86.5 L68 86.5"/>
          <path class="mouth mouth-frown" d="M51 90 Q60 84 69 90"/>
        </g>
      </g>
    </svg>
    <div class="bubble" id="bubble"><span class="de"></span><span class="en"></span></div>
  </div>

  <section id="feedback" hidden></section>

  <form id="form" autocomplete="off">
    <input id="in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Type the German">
    <button id="go" type="submit">Check</button>
  </form>
  <div class="aids" id="aids">
    <button id="hintBtn" type="button">Hint</button>
    <button id="idkBtn" type="button">I don't know</button>
  </div>


  <p id="notice"></p>
</main>

<div id="help" class="help" hidden>
  <div class="help-box" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <header class="help-head"><span id="helpTitle">Help</span><button id="helpClose" aria-label="Close">×</button></header>
    <div class="help-body">
      <nav id="helpNav" class="help-nav"></nav>
      <div class="help-pane">
        <div id="helpPage" class="help-page"></div>
        <div class="help-pager"><button id="hPrev" aria-label="Previous page">‹</button><span id="hDots"></span><button id="hNext" aria-label="Next page">›</button></div>
      </div>
    </div>
  </div>
</div>

<div id="bank" class="help" hidden>
  <div class="help-box" role="dialog" aria-modal="true" aria-labelledby="bankTitle">
    <header class="help-head"><span id="bankTitle">Words</span><button id="bankClose" aria-label="Close">×</button></header>
    <div class="bank-filters" id="bankFilters"></div>
    <div class="bank-list" id="bankList"></div>
    <div class="bank-foot">
      <button type="button" id="exportBtn">Export</button>
      <button type="button" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <span id="backupInfo"></span>
    </div>
  </div>
</div>

<nav class="modes"><div>
  <button data-mode="recall" aria-current="true">Recall</button>
  <button data-mode="sentence">Sentence</button>
  <button data-mode="add">Add word</button>
  <button id="dirBtn" class="dir" title="Switch direction">EN→DE</button>
</div></nav>

<script>
/* ---------- DATA SPINE ---------- */
const w = (de,en,gender,plural,theme,example,exampleEn,alt) => ({de,en,gender,plural,theme,example,exampleEn,alt:alt||[],source:"app",srs:{level:0,lastSeen:null,misses:0}});

let faceTimer = null;
function say(key, custom) {
  const pair = custom || LINES[key][Math.random() * LINES[key].length | 0];
  const [main, gloss] = dir === "de" ? pair : [pair[1], pair[0]];
  el.bubble.querySelector(".de").textContent = main || gloss;
  el.bubble.querySelector(".en").textContent = main ? (gloss || "") : "";
  el.teacher.classList.remove("quiet");
  el.teacher.dataset.face = "idle"; void el.teacher.offsetWidth; // restart animations
  el.teacher.dataset.face = FACE[key];
  clearTimeout(faceTimer);
  if (FACE[key] !== "idle") faceTimer = setTimeout(() => { el.teacher.dataset.face = "idle"; }, 3200);
}

/* ---------- SPEECH (slang only; browser built-in, offline) ---------- */
const CAN_SPEAK = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
const speakLang = () => dir === "de" ? "de-DE" : "en-US";
function speak(text, lang, btn) {
  if (!CAN_SPEAK || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0, 2)));
    if (v) u.voice = v;
    if (btn) { btn.classList.add("speaking"); u.onend = u.onerror = () => btn.classList.remove("speaking"); }
    speechSynthesis.speak(u);
  } catch {}
}
if (CAN_SPEAK) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch {} }
const sayBtn = x => CAN_SPEAK && isSlang(x) ? `<button type="button" class="say" data-say="${esc(tgtText(x))}" data-lang="${speakLang()}">🔊 ${esc(t().sayIt)}</button>` : "";
document.addEventListener("click", e => { const b = e.target.closest("button[data-say]"); if (b) speak(b.dataset.say, b.dataset.lang, b); });

/* ---------- HELPERS ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s ?? "").toLowerCase().trim()
  .replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
  .replace(/[’‘`´]/g,"'").replace(/[?!.,;:]/g,"").replace(/\s+/g," ").trim();
const keyOf = x => norm(x.de) + "|" + (x.gender || "");

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const base = x.en.replace(/\(.*?\)/g, "").split("/").map(v => v.trim()).filter(Boolean);
  const out = [];
  for (const b of base) { out.push(b); if (/^to /.test(b)) out.push(b.slice(3)); out.push(b.replace(/'/g, "")); }
  return out.map(norm);
};
const enPrimary = x => x.en.replace(/\(.*?\)/g, "").split("/")[0].trim().replace(/^to /, "");
/* target = what the learner types; native = what they're shown */
const tgtHtml = x => dir === "de" ? fullDe(x) : esc(x.en);
const tgtText = x => dir === "de" ? fullDeText(x) : x.en;
const natHtml = x => dir === "de" ? esc(x.en) : fullDe(x);
const exampleOf = x => dir === "de" ? x.example : (x.exampleEn || "");

/* ---------- STORAGE ---------- */
async function sget(key) {
  try {
    if (window.storage) { const r = await window.storage.get(key, false); return r && r.value ? JSON.parse(r.value) : null; }
    const v = localStorage.getItem(key); return v ? JSON.parse(v) : null;
  } catch { return null; }
}
async function sset(key, val) {
  try {
    if (window.storage) { const r = await window.storage.set(key, JSON.stringify(val), false); if (!r) notice(t().saveFail); }
    else localStorage.setItem(key, JSON.stringify(val));
  } catch { notice(t().saveFail); }
}
async function save() { await sset(bankKey(), bank); await sset(statsKey(), stats); }

async function loadBank() {
  const stored = await sget(bankKey());
  if (Array.isArray(stored) && stored.length) {
    bank = stored.map(x => ({ alt: [], ...x, srs: { level: 0, lastSeen: null, misses: 0, ...(x.srs || {}) } }));
    const byKey = new Map(bank.map(x => [keyOf(x), x]));
    const seedKeys = new Set(SEED.map(keyOf));
    for (const x of bank) if (!x.source) x.source = seedKeys.has(keyOf(x)) ? "app" : "self";
    for (const sd of SEED) {
      const have = byKey.get(keyOf(sd));
      if (!have) bank.push(JSON.parse(JSON.stringify(sd)));
      else if (!have.exampleEn && sd.exampleEn) have.exampleEn = sd.exampleEn; // backfill new field, keep progress
    }
  } else {
    bank = JSON.parse(JSON.stringify(SEED));
  }
  const st = await sget(statsKey());
  stats = st ? { streak: 0, best: 0, ...st } : { streak: 0, best: 0 };
}
/* One-time setup from a link: #key=sk-ant-…&dir=en  — read, stored on this device, then removed from the address bar. */
let linkKey = false;
function applyLinkSetup() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return;
  const q = new URLSearchParams(h);
  const k = (q.get("key") || "").trim(), d = q.get("dir");
  try {
    if (k) { localStorage.setItem("de-apikey", k); linkKey = true; }
    if (d === "de" || d === "en") { dir = d; localStorage.setItem("de-direction-link", d); }
  } catch {}
  history.replaceState(null, "", location.pathname + location.search);
}
async function load() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  applyLinkSetup();
  const d = await sget(DIR_KEY);
  if (d === "de" || d === "en") dir = d;
  try { const ld = localStorage.getItem("de-direction-link"); if (ld) { dir = ld; localStorage.removeItem("de-direction-link"); await sset(DIR_KEY, dir); } } catch {}
  await loadBank();
  if (STANDALONE) {
    el.keyBtn.hidden = false;
    if (linkKey) testKey();
    else if (!apiKey()) notice(t().standalone);
  }
}

/* ---------- SRS updates ---------- */
function mark(word, result) { // "ok" | "minor" | "hinted" | "bad"
  const s = word.srs;
  if (result === "ok") { s.level = Math.min(INTERVALS.length - 1, s.level + 1); stats.streak++; stats.best = Math.max(stats.best, stats.streak); }
  else if (result === "bad") { s.level = 0; s.misses++; stats.streak = 0; }
  // "minor" and "hinted": level, misses and streak stay put
  s.lastSeen = Date.now();
  renderStrip();
}

const inScope = x => scope === "slang" ? isSlang(x) : !isSlang(x);
function buildSession() {
  const pool = bank.filter(inScope);
  const due = shuffle(pool.filter(isDue)).sort((a, b) => a.srs.level - b.srs.level);
  let pick = due.slice(0, SESSION_SIZE);
  if (pick.length < SESSION_SIZE) {
    const rest = pool.filter(x => !isDue(x)).sort((a, b) => dueAt(a) - dueAt(b));
    pick = pick.concat(rest.slice(0, SESSION_SIZE - pick.length));
  }
  session = pick; idx = 0; sessionRight = 0;
  renderStrip();
}

function dueTargets(n) {
  const words = bank.filter(x => !isSlang(x));
  let pool = shuffle(words.filter(isDue));
  if (pool.length < n) pool = pool.concat(shuffle(words.filter(x => !isDue(x))));
  return pool.slice(0, n);
}

/* ---------- RENDER ---------- */
function notice(msg, good) { el.notice.textContent = msg || ""; el.notice.classList.toggle("good", !!good); }
function renderScope() {
  const has = bank.some(isSlang);
  el.scope.hidden = !(mode === "recall" && has);
  if (!has && scope === "slang") scope = "words";
  el.scope.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.scope === scope)));
}
function renderStrip() {
  el.progress.textContent = Math.min(idx, session.length);
  el.streak.textContent = stats.streak;
  el.best.textContent = stats.best;
}
function renderChrome() {
  const L = t();

  el.bankBtn.textContent = L.bank; el.keyBtn.textContent = L.key;
  el.hintBtn.textContent = L.hint; el.idkBtn.textContent = L.idk;
  el.dirBtn.textContent = L.dirLabel;

  document.querySelectorAll("nav.modes button[data-mode]").forEach(b => { b.textContent = L.modes[b.dataset.mode]; });
  document.documentElement.lang = dir === "de" ? "en" : "de";
}
function stage(title, subHtml, busyLook) {
  el.prompt.innerHTML = title;
  el.sub.innerHTML = subHtml || "";
  document.body.classList.toggle("busy", !!busyLook);
}
function showFeedback(html) { el.fb.innerHTML = html; el.fb.hidden = false; phase = "feedback"; el.input.value = ""; el.input.placeholder = t().enterNext; setBtn(t().next); focus(); }
function setBtn(label) { el.go.textContent = label; }
function hideFeedback() { el.fb.hidden = true; el.fb.innerHTML = ""; cancelAuto(); }
function cancelAuto() { clearTimeout(autoTimer); autoTimer = null; }
function advance() { if (mode === "recall") showRecall(); else if (mode === "sentence") startSentence(); else showAdd(); }
function scheduleAuto() { cancelAuto(); autoTimer = setTimeout(() => { autoTimer = null; if (phase === "feedback") advance(); }, AUTO_MS); }
/* Refocus the input only when the user was already typing, or on a mouse device — never after a tap on a phone. */
const TOUCH = matchMedia("(hover: none)").matches;
let wasTyping = false;
function focus() { if (!TOUCH || wasTyping) setTimeout(() => el.input.focus(), 0); }
function setBusy(b) { busy = b; el.input.disabled = b; el.go.disabled = b; el.hintBtn.disabled = b; el.idkBtn.disabled = b; el.dirBtn.disabled = b; if (!b) focus(); }
function showAids(show) { el.aids.hidden = !show; hints = 0; el.hintBtn.textContent = t().hint; el.hintBtn.disabled = false; }

/* Hint: one letter per press, capped at half the word. Article is never hinted. */
const hintWord = x => dir === "de" ? x.de : enPrimary(x);
function hintMax(word) { return Math.ceil(word.replace(/\s/g, "").length / 2); }
function hintMask(word, n) {
  let shown = 0;
  return [...word].map(ch => {
    if (ch === " ") return "  ";
    if (shown < n) { shown++; return ch; }
    return ch === "'" || ch === "?" ? ch : "_";
  }).join("");
}
function chipFor(x) { return dir === "de" && x.gender ? t().nounChip : t().themes[x.theme] || x.theme; }
function giveHint() {
  if (busy || phase !== "ask") return;
  if (mode === "recall") {
    const word = hintWord(current), max = hintMax(word);
    if (hints >= max) return;
    hints++;
    say(hints === 1 ? "hint" : "hint2");
    el.sub.innerHTML = `<span class="chip">${esc(chipFor(current))}</span><span class="hint">${esc(hintMask(word, hints))}</span>`;
    if (hints >= max) { el.hintBtn.textContent = t().noHints; el.hintBtn.disabled = true; }
    focus();
  } else if (mode === "sentence" && sent) {
    teacherNudge();
  }
}

/* Sentence hint: Frau Shego points at the rule, never at the word. Two per sentence. */
const RULES = () => dir === "de"
  ? "verb second, accusative after this verb, gender of the noun, negation with nicht/kein"
  : "subject-verb-object order, a/an/the, third-person -s, present simple vs present continuous, the preposition";
async function teacherNudge() {
  if (hints >= 2) return;
  hints++;
  const draft = el.input.value.trim();
  setBusy(true);
  say("think");
  try {
    const r = await claude(
      `You are Frau Shego, a strict but fair ${LEARN()} teacher. A learner whose native language is ${NATIVE()} (A1–A2 level) asked for a hint on translating a sentence into ${LEARN()}. Return ONLY JSON, no markdown: {"hint":"<your hint in simple ${LEARN()}, max 12 words>","gloss":"<${NATIVE()} translation of your hint>"}. Point at the grammar rule they need (${RULES()}). Never write any target ${LEARN()} word, its article, or any inflected form of it — describe the rule abstractly ("the noun after this verb takes the accusative"). Write one complete, grammatically correct ${LEARN()} sentence. ${hints === 1 ? "Tone: dry, one short sigh allowed, then the nudge." : "This is their second hint: drier and more pointed, and you may name the rule outright."}${draft ? " Comment on what they have typed so far if useful." : ""}`,
      `${NATIVE()} prompt: ${sent.prompt}\nTarget words (${LEARN()} → ${NATIVE()}): ${sent.targets.map(x => `${tgtText(x)} → ${dir === "de" ? x.en : fullDeText(x)}`).join("; ")}\nLearner's draft so far: ${draft || "(nothing yet)"}`
    );
    if (!r || !r.hint) throw new Error("bad hint shape");
    setBusy(false);
    const hint = scrubTargets(r.hint), gloss = scrubTargets(r.gloss || "");
    say(hints === 1 ? "hint" : "hint2", dir === "de" ? [hint, gloss] : [gloss, hint]);
    if (hints >= 2) { el.hintBtn.textContent = t().noHints; el.hintBtn.disabled = true; }
  } catch (e) {
    hints--; setBusy(false);
    say("hint", UNREACHABLE);
    notice(t().hintFail);
  }
}
/* Belt and braces: if the model leaks a target word into a hint, blank it out client-side. */
function scrubTargets(text) {
  let out = String(text || "");
  for (const x of sent.targets) {
    const forms = dir === "de"
      ? [x.de, x.plural, x.gender ? `${x.gender} ${x.de}` : null]
      : x.en.replace(/\(.*?\)/g, "").split("/").map(v => v.trim().replace(/^to /, ""));
    for (const f of forms.filter(Boolean).sort((a, b) => b.length - a.length)) {
      const re = new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      out = out.replace(re, "___");
    }
  }
  return out.replace(/(___\s*){2,}/g, "___ ");
}
function giveUp() {
  if (busy || phase !== "ask") return;
  if (mode === "recall") gradeRecall("");
  else if (mode === "sentence") gradeSentence("", true);
}

/* ---------- WORD BANK SHEET ---------- */
const bankEl = { box: $("bank"), title: $("bankTitle"), filters: $("bankFilters"), list: $("bankList"), close: $("bankClose") };
const bf = { source: "all", due: false, missed: false, theme: "all" };
const THEMES = ["greetings", "directions", "daily", "opinions", "time", "other", "slang"];
const weakSort = (a, b) => b.srs.misses - a.srs.misses || a.srs.level - b.srs.level || tgtText(a).localeCompare(tgtText(b));
function bankRow(x) {
  const L = t();
  return `<div class="row"><div class="w"><span class="tgt">${tgtHtml(x)}${x.source === "self" ? `<span class="tag">${esc(L.mineTag)}</span>` : ""}${sayBtn(x)}</span><span class="nat">${natHtml(x)}</span>${x.note ? `<span class="note">${esc(x.note)}</span>` : ""}</div><div class="meta">L${x.srs.level}<br>${x.srs.misses ? `<b>${esc(L.misses(x.srs.misses))}</b>` : "&nbsp;"}</div></div>`;
}
function renderBank() {
  const L = t();
  const chip = (label, on, data) => `<button type="button" aria-pressed="${on}" ${data}>${esc(label)}</button>`;
  bankEl.filters.innerHTML =
    `<div class="frow">${chip(L.fAll, bf.source === "all", 'data-src="all"')}${chip(L.fApp, bf.source === "app", 'data-src="app"')}${chip(L.fMine, bf.source === "self", 'data-src="self"')}` +
    `<span style="width:6px;flex:none"></span>${chip(L.fDue, bf.due, 'data-due')}${chip(L.fMissed, bf.missed, 'data-missed')}</div>` +
    `<div class="frow">${chip(L.allThemes, bf.theme === "all", 'data-theme="all"')}${THEMES.filter(th => bank.some(x => x.theme === th)).map(th => chip(L.themes[th] || th, bf.theme === th, `data-theme="${th}"`)).join("")}</div>`;
  const filtered = bank.filter(x =>
    (bf.source === "all" || x.source === bf.source) &&
    (!bf.due || isDue(x)) && (!bf.missed || x.srs.misses > 0) &&
    (bf.theme === "all" || x.theme === bf.theme)).sort(weakSort);
  const anyFilter = bf.source !== "all" || bf.due || bf.missed || bf.theme !== "all";
  bankEl.title.textContent = `${L.bank} · ${filtered.length}${anyFilter ? " / " + bank.length : ""}`;
  let html = "";
  if (!anyFilter) {
    const top = bank.filter(x => x.srs.misses > 0).sort(weakSort).slice(0, 5);
    html += `<h4>${esc(L.mostMissed)}</h4>` + (top.length ? top.map(bankRow).join("") : `<div class="empty">${esc(L.nothingYet)}</div>`);
    html += `<h4>${esc(L.allWords)}</h4>`;
  }
  html += filtered.length ? filtered.map(bankRow).join("") : `<div class="empty">${esc(L.noMatch)}</div>`;
  bankEl.list.innerHTML = html;
}
/* ---------- BACKUP ---------- */
const BACKUP_KEY = "de-lastbackup";
const bankEl2 = { exportBtn: $("exportBtn"), importBtn: $("importBtn"), importFile: $("importFile"), info: $("backupInfo") };
async function exportBackup() {
  const other = dir === "de" ? "en" : "de";
  const payload = {
    app: "hin-und-her", version: 1, exported: new Date().toISOString(),
    banks: { [dir]: bank, [other]: (await sget(other === "de" ? "de-wordbank" : "en-wordbank")) || [] },
    stats: { [dir]: stats, [other]: (await sget(other === "de" ? "de-stats" : "en-stats")) || { streak: 0, best: 0 } },
    direction: dir,
  };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `hin-und-her-backup-${payload.exported.slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  try { localStorage.setItem(BACKUP_KEY, payload.exported); } catch {}
  const n = Object.values(payload.banks).reduce((t, b) => t + b.length, 0);
  notice(t().backupSaved(n), true); renderBackupInfo();
}
/* Merge, never delete: unknown words are added; known words take whichever side was seen more recently. */
function mergeBank(into, from) {
  let added = 0, updated = 0;
  const byKey = new Map(into.map(x => [keyOf(x), x]));
  for (const x of from) {
    if (!x || !x.de || !x.en) continue;
    const have = byKey.get(keyOf(x));
    if (!have) { into.push({ alt: [], source: "self", ...x, srs: { level: 0, lastSeen: null, misses: 0, ...(x.srs || {}) } }); added++; }
    else if ((x.srs && x.srs.lastSeen || 0) > (have.srs.lastSeen || 0)) { Object.assign(have, x, { srs: { ...have.srs, ...x.srs } }); updated++; }
    else if (x.note && !have.note) { have.note = x.note; }
  }
  return { added, updated };
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { notice(t().restoreBad); return; }
  if (!data || data.app !== "hin-und-her" || !data.banks) { notice(t().restoreBad); return; }
  let added = 0, updated = 0;
  for (const d of ["de", "en"]) {
    const incoming = Array.isArray(data.banks[d]) ? data.banks[d] : [];
    if (!incoming.length) continue;
    const bk = d === "de" ? "de-wordbank" : "en-wordbank", sk = d === "de" ? "de-stats" : "en-stats";
    let target = d === dir ? bank : ((await sget(bk)) || []);
    const r = mergeBank(target, incoming); added += r.added; updated += r.updated;
    const st = d === dir ? stats : ((await sget(sk)) || { streak: 0, best: 0 });
    const inc = data.stats && data.stats[d];
    if (inc) st.best = Math.max(st.best || 0, inc.best || 0);
    if (d === dir) { bank = target; stats = st; await save(); }
    else { await sset(bk, target); await sset(sk, st); }
  }
  notice(t().restored(added, updated), true);
  renderStrip(); renderScope(); buildSession(); if (mode === "recall") showRecall(); renderBank();
}
function renderBackupInfo() {
  const L = t();
  bankEl2.exportBtn.textContent = L.export; bankEl2.importBtn.textContent = L.import;
  bankEl2.exportBtn.title = bankEl2.importBtn.title = L.backupHint;
  let last = null; try { last = localStorage.getItem(BACKUP_KEY); } catch {}
  bankEl2.info.textContent = last ? L.lastBackup(new Date(last).toLocaleDateString(dir === "de" ? "en-US" : "de-DE")) : L.noBackup;
}
bankEl2.exportBtn.addEventListener("click", exportBackup);
bankEl2.importBtn.addEventListener("click", () => bankEl2.importFile.click());
bankEl2.importFile.addEventListener("change", () => { const f = bankEl2.importFile.files[0]; bankEl2.importFile.value = ""; if (f) importBackup(f); });

function openBank() { renderBank(); renderBackupInfo(); bankEl.box.hidden = false; bankEl.list.scrollTop = 0; bankEl.close.focus(); }
function closeBank() { bankEl.box.hidden = true; focus(); }
bankEl.filters.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.src) bf.source = b.dataset.src;
  else if ("due" in b.dataset) bf.due = !bf.due;

/* ---------- RECALL ---------- */
function showRecall() {
  hideFeedback();
  const L = t();
  renderScope();
  if (!session.length) { phase = "done"; showAids(false); stage(esc(L.noSlangYet), ""); el.input.value = ""; setBtn(L.newSession); return; }
  if (idx >= session.length) {
    phase = "done";
    showAids(false);
    say("done");
    stage(esc(L.sessionDone(sessionRight, session.length)), esc(L.sessionSub));
    el.input.placeholder = L.enterNew; el.input.value = ""; setBtn(L.newSession);
    return;
  }
  current = session[idx];
  phase = "ask";
  showAids(true);
  const note = isSlang(current) && current.note ? `<span class="chip">${esc(current.note)}</span>` : "";
  stage(natHtml(current), `<span class="chip">${esc(chipFor(current))}</span>${note}`);
  el.input.placeholder = L.typeTarget; el.input.value = ""; setBtn(L.check);
  focus();
}

function gradeRecall(raw) {
  const x = current, inp = norm(raw), used = hints, L = t();
  let ok = false, reason = "";
  if (!inp) reason = L.skipped;
  else if (dir === "en") {
    ok = enForms(x).includes(inp);
  } else {
    const targets = [norm(x.de), ...(x.alt || []).map(norm)];
    if (x.gender) {
      const m = inp.match(/^(der|die|das)\s+(.+)$/);
      if (!m) reason = targets.includes(inp) ? L.needArticle(x.gender) : "";
      else {
        const wordOk = targets.includes(m[2]);
        ok = wordOk && m[1] === x.gender;
        if (wordOk && !ok) reason = L.wrongArticle(x.de, x.gender, m[1]);
      }
    } else ok = targets.includes(inp);
  }

  const result = ok ? (used ? "hinted" : "ok") : "bad";
  say(result === "ok" ? "right" : result === "hinted" ? "hinted" : inp ? "wrong" : "idk");
  mark(x, result);
  if (ok) sessionRight++;
  idx++; renderStrip(); save();
  showAids(false);

  const plural = dir === "de" && x.gender && x.plural ? `<small>${L.pl} ${esc(x.plural)}</small>` : "";
  const ex = exampleOf(x);
  showFeedback(`
    <span class="verdict ${result}">${result === "ok" ? L.correct : result === "hinted" ? L.correctHint(used) : inp ? L.wrong : L.didntKnow}</span>
    <div class="answer">${tgtHtml(x)}${plural}${sayBtn(x)}</div>
    ${reason ? `<div class="reason">${esc(reason)}</div>` : ""}
    ${!ok && inp ? `<div class="reason">${esc(L.youWrote)} ${esc(raw)}</div>` : ""}
    ${ex ? `<div class="example">${esc(ex)}</div>` : ""}
    <div class="next">${esc(L.level(x.srs.level))}${result === "hinted" ? esc(L.noLevelUp) : ""}. ${result === "ok" ? esc(L.autoNext) : esc(L.enterForNext)}</div>
    ${result === "ok" ? `<div class="auto"><i></i></div>` : ""}`);
  if (result === "ok") scheduleAuto();
}

/* ---------- API ---------- */
/* To ship a copy with the key already inside, paste it between the quotes below.
   Anyone who has this file then has the key — only do this for a copy you hand to one trusted person,
   and give them their own key from your console so you can revoke it on its own. */
const EMBEDDED_KEY = "";
function apiKey() { try { return localStorage.getItem("de-apikey") || EMBEDDED_KEY; } catch { return EMBEDDED_KEY; } }
function setApiKey() {
  const k = prompt(t().keyPrompt, apiKey());

}
async function testKey() {

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": apiKey(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 5, messages: [{ role: "user", content: "Reply with OK." }] })

  }
}
async function claude(system, user) {
  const headers = { "Content-Type": "application/json" };
  const key = STANDALONE ? apiKey() : "";
  if (key) { headers["x-api-key"] = key; headers["anthropic-version"] = "2023-06-01"; headers["anthropic-dangerous-direct-browser-access"] = "true"; }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", headers,
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system, messages: [{ role: "user", content: user }] })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const text = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error("no JSON in reply");
  return JSON.parse(m[0]);
}
function apiFail(err) {
  console.error(err);
  notice(t().apiBack);
  setMode("recall");
}

/* ---------- SENTENCE ---------- */
async function startSentence() {
  hideFeedback(); notice("");
  const targets = dueTargets(2 + (Math.random() < 0.5 ? 1 : 0));
  sent = { prompt: "", targets };
  stage(esc(t().building), "", true);
  showAids(false);
  setBusy(true);
  try {
    const r = await claude(
      `You are a ${LEARN()} tutor for an A1–A2 learner whose native language is ${NATIVE()}. Return ONLY JSON, no markdown, shaped exactly: {"prompt":"<one short ${NATIVE()} sentence the learner will translate into ${LEARN()}>"}. The sentence must use every target word, be 5–9 words, present tense, one clause, everyday register.${dir === "de" ? ' Use "you" (informal du) unless a formal cue fits.' : ""}`,
      `Target words (${LEARN()} → ${NATIVE()}): ${targets.map(x => `${tgtText(x)} → ${dir === "de" ? x.en : fullDeText(x)}`).join("; ")}. The learner also knows these core words and may need them: ${CORE_TEXT}. Build the prompt.`
    );
    if (!r || typeof r.prompt !== "string") throw new Error("bad prompt shape");
    sent.prompt = r.prompt;
    phase = "ask";
    stage(esc(r.prompt), `${esc(t().use)} ${targets.map(x => `<span class="chip">${natHtml(x)}</span>`).join("")}`);

}

const GRADE_RULES = () => dir === "de"
  ? `"wrong" = wrong article, wrong case, verb not in second position, wrong conjugation, a target word missing, or meaning off. Explanation focuses on gender, case, verb position, or conjugation.`
  : `"wrong" = wrong or missing a/an/the, wrong word order, missing third-person -s, wrong tense or verb form, a target word missing, or meaning off. Explanation focuses on articles, word order, or verb form. Do not penalise British vs American spelling.`;
async function gradeSentence(raw, gaveUp) {
  const L = t();
  if (!gaveUp && !raw.trim()) { notice(L.typeSentenceFirst); return; }
  notice("");
  const used = hints;
  setBusy(true);
  try {
    const notes = dir === "de" ? sent.targets.map(x => GRADER_NOTES[x.de]).filter(Boolean) : [];
    const r = await claude(
      `You grade a ${LEARN()} sentence written by an A1–A2 learner whose native language is ${NATIVE()}. Return ONLY JSON, no markdown, shaped exactly: {"verdict":"correct"|"minor"|"wrong","explanation":"<one sentence in ${NATIVE()}, max 25 words, naming the specific error>","corrected":"<the best correct ${LEARN()} sentence>"}. "correct" = fully correct (ignore missing final punctuation). "minor" = meaning clear with one small slip such as a typo, capitalization, or a small ending. ${GRADE_RULES()} If the learner gave up, verdict is "wrong" and the explanation is one line on the key grammar point of the corrected sentence. Core words the learner knows and may use freely: ${CORE_TEXT}.${notes.length ? "\nSpecial checks for this sentence:\n- " + notes.join("\n- ") : ""}`,
      `${NATIVE()} prompt: ${sent.prompt}\nTarget words: ${sent.targets.map(x => `${tgtText(x)} (${dir === "de" ? x.en : fullDeText(x)})`).join("; ")}\nLearner wrote: ${gaveUp ? "(gave up — no answer)" : raw}`
    );
    let v = gaveUp ? "bad" : r.verdict === "correct" ? "ok" : r.verdict === "minor" ? "minor" : "bad";
    if (v === "ok" && used) v = "hinted";
    say(v === "ok" ? "right" : v === "hinted" ? "hinted" : v === "minor" ? "minor" : gaveUp ? "idk" : "wrong");
    sent.targets.forEach(x => mark(x, v));
    save();
    setBusy(false);
    showAids(false);
    showFeedback(`
      <span class="verdict ${v}">${v === "ok" ? L.correct : v === "hinted" ? L.correctHint(1) : v === "minor" ? L.minor : gaveUp ? L.didntKnow : L.wrong}</span>
      <div class="answer" style="font-size:20px">${esc(r.corrected || "")}</div>
      <div class="reason">${esc(r.explanation || "")}</div>
      ${gaveUp ? "" : `<div class="reason" style="color:var(--muted)">${esc(L.youWrote)} ${esc(raw)}</div>`}
      <div class="next">${v === "ok" ? L.targetsUp : v === "bad" ? L.targetsReset : L.targetsSame} ${v === "ok" ? esc(L.autoNext) : esc(L.enterForNext)}</div>
      ${v === "ok" ? `<div class="auto"><i></i></div>` : ""}`);
    if (v === "ok") scheduleAuto();
  } catch (e) {
    console.error(e); setBusy(false);
    el.input.value = raw;
    notice(L.gradeFail);
  }
}

function addTabs() {
  const L = t();
  return `<span class="tab" role="button" aria-pressed="${addKind === "dict"}" data-kind="dict">${esc(L.dictTab)}</span><span class="tab" role="button" aria-pressed="${addKind === "slang"}" data-kind="slang">${esc(L.slangTab)}</span>`;
}
function showAdd() {
  hideFeedback(); phase = "ask"; showAids(false);
  const L = t();
  slangStep = 0; slangDraft = { word: "", meaning: "" };
  if (addKind === "dict") {
    stage(esc(L.addTitle), `${addTabs()}<br>${esc(L.addSub(bank.length))}`);
    el.input.placeholder = L.addPh; el.input.value = ""; setBtn(L.add);
  } else showSlangStep();
  focus();
}
function showSlangStep() {
  const L = t();
  if (slangStep === 0) { stage(esc(L.slangWord), `${addTabs()}<br>${esc(L.slangWordSub)}`); el.input.placeholder = L.slangPh1; setBtn(L.next); }
  else if (slangStep === 1) { stage(esc(L.slangMeaning(slangDraft.word)), addTabs()); el.input.placeholder = L.slangPh2; setBtn(L.next); }
  else { stage(esc(L.slangNote), `<span class="chip">${esc(slangDraft.word)}</span><span class="chip">${esc(slangDraft.meaning)}</span>`); el.input.placeholder = L.slangPh3; setBtn(L.add); }
  el.input.value = ""; phase = "ask";
}
function addSlang(raw) {
  const L = t(), v = raw.trim();
  if (slangStep === 0) { if (!v) { notice(L.typeWordFirst); return; } slangDraft.word = v; slangStep = 1; showSlangStep(); return; }
  if (slangStep === 1) { if (!v) { notice(L.typeWordFirst); return; } slangDraft.meaning = v; slangStep = 2; showSlangStep(); return; }
  notice("");
  // target language holds the slang word; native holds the meaning. Article typed with a German noun becomes its gender.
  let word = slangDraft.word, gender = null;
  if (dir === "de") { const m = word.match(/^(der|die|das)\s+(.+)$/i); if (m) { gender = m[1].toLowerCase(); word = m[2]; } }
  const entry = dir === "de" ? w(word, slangDraft.meaning, gender, null, "slang", "", "") : w(slangDraft.meaning, word, null, null, "slang", "", "");
  entry.source = "self"; entry.note = v;
  const bare = x => norm(dir === "de" ? x.de : x.en);
  const dup = bank.find(x => isSlang(x) && bare(x) === bare(entry));
  if (dup) {
    showFeedback(`<span class="verdict minor">${esc(L.slangDup)}</span><div class="answer">${tgtHtml(dup)}${sayBtn(dup)}</div><div class="reason">${natHtml(dup)}</div><div class="next">${esc(L.enterAnother)}</div>`);
    return;
  }
  bank.push(entry); save(); say("added"); renderScope();
  showFeedback(`<span class="verdict ok">${esc(L.slangSaved)}</span><div class="answer">${tgtHtml(entry)}${sayBtn(entry)}</div><div class="reason">${natHtml(entry)}</div>${v ? `<div class="example">${esc(v)}</div>` : ""}<div class="next">${esc(L.nowWords(bank.length))} ${esc(L.enterAnother)}</div>`);
}

async function addWord(raw) {
  const L = t();
  if (!raw.trim()) { notice(L.typeWordFirst); return; }
  notice("");
  setBusy(true);
  stage(esc(L.looking), "", true);
  try {
    const r = await claude(
      `Return ONLY JSON, no markdown, for one German–English vocabulary entry aimed at an A1–A2 learner, shaped exactly: {"de":"<German word without article; verbs in infinitive>","en":"<short English meaning; verbs as 'to …'>","gender":"der"|"die"|"das"|null,"plural":"<German plural without article, or null if not a noun or no common plural>","theme":"greetings"|"directions"|"daily"|"opinions"|"time"|"other","example":"<one short A1 German sentence using the word>","exampleEn":"<the same sentence in natural English>"}. The input may be English or German; if English, choose the most common everyday German equivalent.`,
      raw
    );
    if (!r || !r.de || !r.en) throw new Error("bad entry shape");
    stage(esc(L.addTitle), `${addTabs()}<br>${esc(L.addSub(bank.length))}`);
    const entry = w(r.de, r.en, ["der","die","das"].includes(r.gender) ? r.gender : null, r.plural || null, r.theme || "other", r.example || "", r.exampleEn || "");
    entry.source = "self";
    const dup = bank.find(x => keyOf(x) === keyOf(entry));
    setBusy(false);
    if (dup) {
      showFeedback(`<span class="verdict minor">${esc(L.already)}</span><div class="answer">${tgtHtml(dup)}</div><div class="reason">${natHtml(dup)}, ${esc(L.level(dup.srs.level))}</div><div class="next">${esc(L.enterAnother)}</div>`);
    } else {
      bank.push(entry); await save(); say("added");
      const plural = entry.gender && entry.plural ? `<small>${L.pl} ${esc(entry.plural)}</small>` : "";
      const ex = exampleOf(entry);
      showFeedback(`<span class="verdict ok">${esc(L.added)}</span><div class="answer">${tgtHtml(entry)}${dir === "de" ? plural : ""}</div><div class="reason">${natHtml(entry)} (${esc(L.themes[entry.theme] || entry.theme)})</div>${ex ? `<div class="example">${esc(ex)}</div>` : ""}<div class="next">${esc(L.nowWords(bank.length))} ${esc(L.enterAnother)}</div>`);
    }
  } catch (e) {
    console.error(e); setBusy(false);
    showAdd(); el.input.value = raw;
    notice(L.lookupFail);
  }
}

      `<h3>Runden</h3><p>Eine Runde hat 20 Wörter: zuerst alles Fällige, niedrigste Stufe zuerst, dann die bald fälligen zum Auffüllen. Was du gerade falsch hattest, kommt direkt wieder.</p><p><b>Wörter</b> zeigt oben die fünf häufigsten Fehler, sortiert nach Fehlern, dann nach Stufe.</p><h3>Sicherung</h3><p>Unten in „Wörter": <b>Sichern</b> speichert eine kleine Datei mit allem — beide Richtungen, Stufen, Slang, Serie (nicht der Key). <b>Wiederherstellen</b> spielt eine Sicherung zurück; nichts wird gelöscht, und der zuletzt geübte Stand gewinnt. Einmal im Monat oder vor einem Handywechsel.</p>`,
      `<h3>Serie</h3><p>Richtige Antworten in Folge, über Runden hinweg. Ein Tipp unterbricht sie nicht, ein Fehler schon. <b>Rekord</b> ist deine längste Serie.</p>`,
    ]},
    { t:"Frau Shego", p:[
      `<h3>Deine Lehrerin</h3><p>Sie spricht die Sprache, die du lernst; die kleine Zeile ist deine. Lies ihre Sätze — <i>Right. Exactly. Again?</i> — echtes Klassenzimmer-Englisch, gratis dazu.</p>`,
      `<h3>Ihre Laune</h3><p>Zufrieden, wenn du richtig liegst. Unbeeindruckt, wenn du einen Tipp willst. Resigniert, wenn du aufgibst. Trocken, nicht gemein — eine hochgezogene Augenbraue, keine Predigt.</p>`,
    ]},
    { t:"Richtung & Key", p:[
      `<h3>Zwei Richtungen</h3><p><b>DE→EN</b> — du kannst Deutsch und lernst Englisch.</p><p><b>EN→DE</b> — umgekehrt. Die App wechselt auf Englisch und Frau Shego spricht Deutsch.</p><p>Der Fortschritt wird pro Richtung getrennt gespeichert — zwei Leute können sich ein Handy teilen.</p>`,
      `<h3>Online und offline</h3><p><b>Abfrage</b> funktioniert offline, ohne Key.</p><p><b>Satz</b>, <b>Wort +</b> und die Tipps von Frau Shego sprechen mit der API: sie brauchen Internet.</p><p>Außerhalb der Claude-App: auf <b>Key</b> tippen und einen API-Key einfügen. Er bleibt nur in diesem Browser und verlässt dein Gerät nur für die API.</p>`,
    ]},
  ],
};
let helpTopic = 0, helpPage = 0;
const helpEl = { box: $("help"), nav: $("helpNav"), page: $("helpPage"), dots: $("hDots"), prev: $("hPrev"), next: $("hNext"), close: $("helpClose"), title: $("helpTitle"), btn: $("helpBtn") };
function helpData() { return HELP[dir === "de" ? "en" : "de"]; }
function renderHelp() {
  const topics = helpData(), topic = topics[helpTopic], n = topic.p.length;
  helpEl.title.textContent = dir === "de" ? "Hin & Her — Help" : "Hin & Her — Hilfe";
  helpEl.nav.innerHTML = topics.map((x, i) => `<button type="button" data-i="${i}" aria-current="${i === helpTopic}">${esc(x.t)}</button>`).join("");
  helpEl.page.innerHTML = topic.p[helpPage];
  helpEl.page.scrollTop = 0;
  helpEl.dots.innerHTML = topic.p.map((_, i) => `<i class="${i === helpPage ? "on" : ""}"></i>`).join("");
  helpEl.prev.disabled = helpPage === 0;
  helpEl.next.disabled = helpPage >= n - 1;
}
function openHelp() { helpTopic = 0; helpPage = 0; renderHelp(); helpEl.box.hidden = false; helpEl.close.focus(); }
function closeHelp() { helpEl.box.hidden = true; focus(); }
helpEl.btn.addEventListener("click", openHelp);
helpEl.close.addEventListener("click", closeHelp);
helpEl.box.addEventListener("click", e => { if (e.target === helpEl.box) closeHelp(); });
helpEl.nav.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (!b) return; helpTopic = +b.dataset.i; helpPage = 0; renderHelp(); });
helpEl.prev.addEventListener("click", () => { if (helpPage > 0) { helpPage--; renderHelp(); } });
helpEl.next.addEventListener("click", () => { if (helpPage < helpData()[helpTopic].p.length - 1) { helpPage++; renderHelp(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !bankEl.box.hidden) { closeBank(); return; }
  if (helpEl.box.hidden) return;
  if (e.key === "Escape") closeHelp();
  else if (e.key === "ArrowRight") helpEl.next.click();
  else if (e.key === "ArrowLeft") helpEl.prev.click();
});

/* ---------- MODE + INPUT + DIRECTION ---------- */
function setMode(m) {
  mode = m; hideFeedback(); showAids(false);
  document.querySelectorAll("nav.modes button[data-mode]").forEach(b => b.setAttribute("aria-current", b.dataset.mode === m ? "true" : "false"));
  renderScope();
  if (m === "recall") { document.body.classList.remove("busy"); if (!session.length || idx >= session.length) buildSession(); showRecall(); }
  else if (m === "sentence") startSentence();
  else showAdd();
}

async function switchDirection() {
  if (busy) return;
  dir = dir === "de" ? "en" : "de";
  scope = "words"; addKind = "dict";
  await sset(DIR_KEY, dir);
  await loadBank();
  notice("");
  renderChrome();
  buildSession();
  setMode("recall");
  say("hello");
}

function onEnter() {
  const raw = el.input.value;
  if (phase === "feedback") { advance(); return; }
  if (phase === "done") { buildSession(); showRecall(); return; }
  if (mode === "recall") gradeRecall(raw);
  else if (mode === "sentence") gradeSentence(raw);
  else if (addKind === "slang") addSlang(raw);
  else addWord(raw);
}

document.addEventListener("pointerdown", () => { wasTyping = document.activeElement === el.input; }, true);
document.addEventListener("keydown", e => { if (e.key === "Enter") wasTyping = document.activeElement === el.input; }, true);
el.form.addEventListener("submit", e => { e.preventDefault(); if (!busy) onEnter(); });
el.input.addEventListener("input", () => {
  if (autoTimer && phase === "feedback" && el.input.value) { const keep = el.input.value; advance(); el.input.value = keep; }
});
el.keyBtn.addEventListener("click", setApiKey);
el.dirBtn.addEventListener("click", switchDirection);
document.querySelectorAll("nav.modes button[data-mode]").forEach(b => b.addEventListener("click", () => { if (!busy) setMode(b.dataset.mode); }));
el.sub.addEventListener("click", e => {
  const tab = e.target.closest(".tab[data-kind]"); if (!tab || busy || mode !== "add") return;
  addKind = tab.dataset.kind; showAdd();
});
el.scope.addEventListener("click", e => {
  const b = e.target.closest("button[data-scope]"); if (!b || busy || b.dataset.scope === scope) return;
  scope = b.dataset.scope; buildSession(); showRecall();
});
el.hintBtn.addEventListener("click", giveHint);
el.idkBtn.addEventListener("click", giveUp);
el.bankBtn.addEventListener("click", openBank);

/* ---------- OFFLINE (hosted only) ---------- */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

/* ---------- START ---------- */
(async () => {
  await load();
  renderChrome();
  buildSession();
  setMode("recall");
  say("hello");
})();
</script>
</body>
</html>
